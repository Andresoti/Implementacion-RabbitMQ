name: pedidos360-ev2
include:
  - compose.rabbitmq.yaml
x-application-environment: &application-environment
  COGNITO_ISSUER: ${COGNITO_ISSUER:?Set COGNITO_ISSUER}
  COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:?Set COGNITO_CLIENT_ID}
  COGNITO_AUDIENCE: ${COGNITO_AUDIENCE:-}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
  RABBITMQ_ADDRESSES: rabbit1:5672,rabbit2:5672
  RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?Set RABBITMQ_USERNAME}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
services:
  database:
    image: postgres:17
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: pedidos360
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - database-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/001-init.sh:ro
      - ./pedidos360-backend/database:/schemas:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U pedidos360 -d postgres]
      interval: 5s
      timeout: 3s
      retries: 30
  orders:
    build:
      context: ./pedidos360-backend
      args:
        MODULE: orders-service
    ports:
      - 127.0.0.1:8080:8080
    environment:
      <<: *application-environment
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://database:5432/pedidos360_orders
      DB_USERNAME: pedidos360
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      DB_DDL_AUTO: validate
    depends_on:
      database:
        condition: service_healthy
      rabbit2:
        condition: service_healthy
  worker:
    build:
      context: ./pedidos360-backend
      args:
        MODULE: worker-service
    ports:
      - 127.0.0.1:8081:8081
    environment:
      <<: *application-environment
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://database:5432/pedidos360_worker
      DB_USERNAME: pedidos360
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      DB_DDL_AUTO: validate
    depends_on:
      database:
        condition: service_healthy
      rabbit2:
        condition: service_healthy
  rabbit-admin:
    build:
      context: ./pedidos360-backend
      args:
        MODULE: rabbit-admin-service
    ports:
      - 127.0.0.1:8082:8082
    environment:
      <<: *application-environment
      SERVER_PORT: 8082
    depends_on:
      rabbit2:
        condition: service_healthy
  frontend:
    build: ./pedidos360-front
    ports:
      - 127.0.0.1:4200:80
    volumes:
      - ${FRONTEND_CONFIG_PATH:-./config/frontend.json}:/usr/share/nginx/html/assets/config.json:ro
volumes:
  database-data:
