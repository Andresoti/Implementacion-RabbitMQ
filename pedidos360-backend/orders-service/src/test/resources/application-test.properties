spring.datasource.url=jdbc:h2:mem:pedidos360;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
app.security.client-id=local-test-client
app.security.audience=local-test-api

spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.dynamic=false
app.outbox.enabled=false
spring.rabbitmq.addresses=localhost:5672
spring.rabbitmq.username=test
spring.rabbitmq.password=test

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:outbox-test.sql
