app.security.issuer=${COGNITO_ISSUER}
app.security.client-id=${COGNITO_CLIENT_ID}
app.security.audience=${COGNITO_AUDIENCE:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
spring.jackson.deserialization.accept-float-as-int=false
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.connection-timeout=5s
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.prefetch=10
spring.rabbitmq.listener.simple.missing-queues-fatal=false

app.rabbit.orders-exchange=pedidos360.orders
app.rabbit.tasks-exchange=pedidos360.tasks
app.rabbit.dead-exchange=pedidos360.dead
app.rabbit.order-route=order.created
app.rabbit.ticket-route=ticket.requested
app.rabbit.notification-queue=pedidos360.notifications
app.rabbit.document-queue=pedidos360.documents
app.rabbit.ticket-queue=pedidos360.tickets
app.rabbit.notification-dlq=pedidos360.notifications.dlq
app.rabbit.document-dlq=pedidos360.documents.dlq
app.rabbit.ticket-dlq=pedidos360.tickets.dlq
app.rabbit.notification-binding=order.*
app.rabbit.document-binding=order.created
app.rabbit.notification-failure=notification.failed
app.rabbit.document-failure=document.failed
app.rabbit.ticket-failure=ticket.failed
