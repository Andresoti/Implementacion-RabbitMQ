map $uri $asset_cache_control {
    default "no-cache";
    /assets/config.json "no-store";
    "~*-[A-Z0-9]{8}\\.(js|css)$" "public, max-age=31536000, immutable";
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header Cache-Control $asset_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https: http://localhost:* http://127.0.0.1:* http://[::1]:*; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    location = /assets/config.json { try_files $uri =404; }
    location /assets/ { try_files $uri =404; }
    location ~* \.(js|css|map|ico|png|svg|woff2?)$ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
